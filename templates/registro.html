<!-- templates/registro.html -->
{% extends "base.html" %}

{% block title %}Crear Cuenta - FM{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Únete a Free Market</h2>
    <form method="POST" action="">
        <div class="form-group">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej. Cristóbal Rodríguez">
        </div>
        <div class="form-group">
            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" name="correo" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres (letras, números, #$%&)">
        </div>
        <button type="submit" class="btn-primary">Crear Cuenta</button>
    </form>
    <p class="text-center">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</div>
{% endblock %}
